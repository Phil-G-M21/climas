<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Admin — CLIMAS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%234fa87b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-bar { border-bottom: 1px solid var(--line-soft); background: var(--base); }
  .admin-bar .nav-in { height: 60px; }
  .admin-brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk'; font-weight: 600; font-size: 17px; }
  .admin-brand .tag { font-size: 11px; letter-spacing: .14em; color: var(--ink-mute); border: 1px solid var(--line); padding: 2px 8px; border-radius: 5px; text-transform: uppercase; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 20px 22px; }
  .stat .num { font-family: 'Space Grotesk'; font-size: 30px; font-weight: 600; line-height: 1; margin-bottom: 8px; }
  .stat .lab { font-size: 13px; color: var(--ink-soft); }
  .stat.accent .num { color: var(--caution); }

  .admin-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
  .admin-tab { background: none; border: none; color: var(--ink-soft); font-family: 'Inter'; font-size: 14.5px; padding: 12px 16px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .admin-tab.active { color: var(--ink); border-bottom-color: var(--safe); }

  .adm-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .adm-toolbar select { padding: 9px 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font-family: 'Inter'; font-size: 14px; }
  .adm-toolbar-right { display: flex; gap: 10px; }
  .adm-toolbar .btn { padding: 9px 15px; font-size: 13.5px; }

  .adm-order { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 20px 22px; margin-bottom: 14px; }
  .adm-order-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .adm-order-id { font-family: 'Space Grotesk'; font-size: 14px; color: var(--ink-soft); }
  .adm-order-grid { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 16px; align-items: start; }
  .adm-field .k { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
  .adm-field .v { font-size: 14.5px; color: var(--ink); line-height: 1.5; }
  .adm-order select { padding: 9px 12px; background: var(--base-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font-family: 'Inter'; font-size: 14px; width: 100%; }
  .btn-del { margin-top: 10px; width: 100%; background: none; border: 1px solid rgba(220,75,62,.4); color: var(--danger); border-radius: 8px; padding: 9px 12px; font-family: 'Inter'; font-size: 13.5px; cursor: pointer; }
  .btn-del:hover { background: rgba(220,75,62,.1); }
  .btn-del:disabled { opacity: .6; cursor: default; }

  .adm-msg { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 20px 22px; margin-bottom: 14px; }
  .adm-msg-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .adm-msg-from { font-weight: 600; font-size: 15px; }
  .adm-msg-meta { font-size: 13px; color: var(--ink-mute); }
  .adm-msg-subject { font-size: 13.5px; color: var(--safe); margin-bottom: 10px; }
  .adm-msg-body { font-size: 14.5px; color: var(--ink-soft); line-height: 1.6; white-space: pre-wrap; }

  .adm-prod { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 22px; margin-bottom: 14px; display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; }
  .adm-prod .pname { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
  .adm-prod .pslug { font-size: 12px; color: var(--ink-mute); font-family: 'Space Grotesk'; }
  .adm-prod .price-edit { display: flex; align-items: center; gap: 8px; }
  .adm-prod .price-edit input { width: 110px; padding: 9px 12px; background: var(--base-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font-family: 'Space Grotesk'; font-size: 15px; }

  @media (max-width: 720px) {
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .adm-order-grid { grid-template-columns: 1fr; }
    .adm-prod { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="nav admin-bar">
  <div class="wrap nav-in">
    <a class="admin-brand" href="admin.html"><span class="dot"></span> CLIMAS <span class="tag">Admin</span></a>
    <div class="nav-right">
      <a class="btn-ghost" href="index.html">View site</a>
      <button class="btn btn-line" id="signOutBtn" style="display:none">Sign out</button>
    </div>
  </div>
</nav>

<div id="loading" class="page-loading"><span class="spinner"></span></div>

<!-- login -->
<div id="loginView" style="display:none">
  <div class="auth-shell">
    <div class="auth-card">
      <h2>Admin sign in</h2>
      <p class="sub">Sign in with your admin account.</p>
      <div class="notice notice-err hide" id="loginErr"></div>
      <div class="field"><label>Email</label><input type="email" id="admEmail" placeholder="Email" autocomplete="off"></div>
      <div class="field"><label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="admPass" placeholder="Your password">
          <button type="button" class="pw-toggle" aria-label="Show password">
            <svg class="ic-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ic-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-solid btn-lg btn-block" id="loginBtn">Sign in</button>
    </div>
  </div>
</div>

<!-- not authorised -->
<div id="denyView" style="display:none">
  <div class="wrap" style="max-width:520px;margin:80px auto">
    <div class="empty-state">
      <h4>Not an admin account</h4>
      <p style="margin-bottom:22px">This account does not have admin access. Sign in with your admin account.</p>
      <button class="btn btn-line" id="denySignOut">Sign out</button>
    </div>
  </div>
</div>

<!-- dashboard -->
<div id="dashView" style="display:none">
  <div class="wrap" style="padding:40px 24px 80px">

    <div class="stat-grid" id="statGrid"></div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="orders">Orders</button>
      <button class="admin-tab" data-tab="messages">Complaints</button>
      <button class="admin-tab" data-tab="products">Products &amp; pricing</button>
    </div>

    <div id="tab-orders">
      <div class="adm-toolbar">
        <select id="orderFilter">
          <option value="all">All statuses</option>
          <option value="pending_payment">Pending payment</option>
          <option value="paid">Paid</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <div class="adm-toolbar-right">
          <button class="btn btn-line" id="refreshOrders">Refresh</button>
          <button class="btn btn-line" id="exportOrders">Export CSV</button>
        </div>
      </div>
      <div id="ordersHost"><div class="page-loading"><span class="spinner"></span></div></div>
    </div>

    <div id="tab-messages" style="display:none">
      <div class="adm-toolbar">
        <span style="font-size:13.5px;color:var(--ink-mute)">Messages from the contact form</span>
        <div class="adm-toolbar-right">
          <button class="btn btn-line" id="refreshMessages">Refresh</button>
          <button class="btn btn-line" id="exportMessages">Export CSV</button>
        </div>
      </div>
      <div id="messagesHost"><div class="page-loading"><span class="spinner"></span></div></div>
    </div>

    <div id="tab-products" style="display:none">
      <p style="font-size:14px;color:var(--ink-soft);margin-bottom:20px">Edit a price in cedis and save. Turning a product off hides it from the shop.</p>
      <div id="productsHost"><div class="page-loading"><span class="spinner"></span></div></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="climas.js"></script>
<script>
  const ORDER_STATUSES = ['pending_payment','paid','shipped','delivered','cancelled'];
  const STATUS_LABEL = { pending_payment:'Pending payment', paid:'Paid', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' };
  const STATUS_BADGE = { pending_payment:'badge-pending', paid:'badge-paid', shipped:'badge-shipped', delivered:'badge-delivered', cancelled:'badge-cancelled' };

  let ALL_ORDERS = [];
  let ALL_MESSAGES = [];

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  function waLink(phone) {
    let d = (phone || '').replace(/\D/g, '');
    if (d.startsWith('0')) d = '233' + d.slice(1);
    else if (d.length === 9) d = '233' + d;
    return d ? 'https://wa.me/' + d : '';
  }

  function gate(view) {
    ['loading','loginView','denyView','dashView'].forEach(v => {
      document.getElementById(v).style.display = (v === view) ? 'block' : 'none';
    });
    document.getElementById('signOutBtn').style.display = (view === 'dashView') ? 'inline-flex' : 'none';
  }

  // ---- login ----
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const err = document.getElementById('loginErr');
    err.classList.add('hide');
    const email = document.getElementById('admEmail').value.trim();
    const pass = document.getElementById('admPass').value;
    if (!email || !pass) { err.textContent = 'Enter your email and password.'; err.classList.remove('hide'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in';
    try { await CLIMAS.signIn(email, pass); location.reload(); }
    catch (e) { err.textContent = e.message || 'Could not sign in.'; err.classList.remove('hide'); btn.disabled = false; btn.textContent = 'Sign in'; }
  });
  document.getElementById('signOutBtn').addEventListener('click', () => CLIMAS.signOut());
  document.getElementById('denySignOut').addEventListener('click', () => CLIMAS.signOut());

  // ---- tabs ----
  document.querySelectorAll('.admin-tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.admin-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    ['orders','messages','products'].forEach(p => {
      document.getElementById('tab-' + p).style.display = (p === t.dataset.tab) ? 'block' : 'none';
    });
  }));

  // ---- orders ----
  async function loadOrders() {
    const host = document.getElementById('ordersHost');
    host.innerHTML = '<div class="page-loading"><span class="spinner"></span></div>';
    const { data, error } = await CLIMAS.sb.from('orders').select('*, order_items(*)').order('created_at', { ascending: false });
    if (error) { host.innerHTML = '<div class="empty-state"><h4>Could not load orders</h4><p>' + esc(error.message) + '</p></div>'; return; }
    ALL_ORDERS = (data || []).filter(o => !o.admin_hidden);
    renderOrders();
  }

  function renderOrders() {
    const host = document.getElementById('ordersHost');
    const filter = document.getElementById('orderFilter').value;
    const list = filter === 'all' ? ALL_ORDERS : ALL_ORDERS.filter(o => o.status === filter);
    if (!list.length) { host.innerHTML = '<div class="empty-state"><h4>No orders' + (filter !== 'all' ? ' with this status' : ' yet') + '</h4></div>'; return; }

    host.innerHTML = list.map(o => {
      const date = new Date(o.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      const items = (o.order_items || []).map(i => i.name_snapshot + (i.qty > 1 ? ' x' + i.qty : '')).join(', ') || 'CLIMAS device';
      const opts = ORDER_STATUSES.map(s => '<option value="' + s + '"' + (s === o.status ? ' selected' : '') + '>' + STATUS_LABEL[s] + '</option>').join('');
      const wa = waLink(o.shipping_phone);
      const phoneHtml = esc(o.shipping_phone) + (wa ? ' · <a href="' + wa + '" target="_blank" rel="noopener" style="color:var(--safe)">WhatsApp</a>' : '');
      return '<div class="adm-order">' +
        '<div class="adm-order-top"><span class="adm-order-id">CLM-' + o.id.slice(0,6).toUpperCase() + ' · ' + date + '</span>' +
        '<span class="badge ' + STATUS_BADGE[o.status] + '">' + STATUS_LABEL[o.status] + '</span></div>' +
        '<div class="adm-order-grid">' +
          '<div class="adm-field"><div class="k">Customer</div><div class="v">' + esc(o.shipping_name) + '<br>' + phoneHtml + '<br>' + esc(o.shipping_city) + '</div>' +
          '<div class="k" style="margin-top:10px">Address</div><div class="v">' + esc(o.shipping_address) + '</div></div>' +
          '<div class="adm-field"><div class="k">Items</div><div class="v">' + esc(items) + '</div>' +
          '<div class="k" style="margin-top:10px">Total</div><div class="v">' + CLIMAS.money(o.subtotal_pesewas) + '</div></div>' +
          '<div class="adm-field"><div class="k">Set status</div>' +
          '<select data-order="' + o.id + '">' + opts + '</select>' +
          '<button class="btn-del" data-del="' + o.id + '">Remove from list</button></div>' +
        '</div></div>';
    }).join('');

    host.querySelectorAll('select[data-order]').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.dataset.order;
        const { error } = await CLIMAS.sb.from('orders').update({ status: sel.value }).eq('id', id);
        if (error) { CLIMAS.toast('Could not update: ' + error.message, 'err'); }
        else { const o = ALL_ORDERS.find(x => x.id === id); if (o) o.status = sel.value; CLIMAS.toast('Order updated', 'ok'); loadStats(); renderOrders(); }
      });
    });

    host.querySelectorAll('button[data-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.del;
        if (!confirm('Remove this order from your admin list? The customer keeps their own copy. This only clears it from your view.')) return;
        btn.disabled = true; btn.textContent = 'Removing...';
        const { error } = await CLIMAS.sb.from('orders').update({ admin_hidden: true }).eq('id', id);
        if (error) { CLIMAS.toast('Could not remove: ' + error.message, 'err'); btn.disabled = false; btn.textContent = 'Remove from list'; return; }
        ALL_ORDERS = ALL_ORDERS.filter(x => x.id !== id);
        renderOrders(); loadStats();
        CLIMAS.toast('Removed from your list', 'ok');
      });
    });
  }

  // ---- messages ----
  async function loadMessages() {
    const host = document.getElementById('messagesHost');
    host.innerHTML = '<div class="page-loading"><span class="spinner"></span></div>';
    const { data, error } = await CLIMAS.sb.from('contact_messages').select('*').order('created_at', { ascending: false });
    if (error) { host.innerHTML = '<div class="empty-state"><h4>Could not load messages</h4><p>' + esc(error.message) + '</p></div>'; return; }
    ALL_MESSAGES = data || [];
    if (!ALL_MESSAGES.length) { host.innerHTML = '<div class="empty-state"><h4>No messages yet</h4></div>'; return; }
    host.innerHTML = ALL_MESSAGES.map(m => {
      const date = new Date(m.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      return '<div class="adm-msg">' +
        '<div class="adm-msg-top"><span class="adm-msg-from">' + esc(m.name) + ' · <a href="mailto:' + esc(m.email) + '" style="color:var(--ink-soft)">' + esc(m.email) + '</a></span>' +
        '<span class="adm-msg-meta">' + date + '</span></div>' +
        (m.subject ? '<div class="adm-msg-subject">' + esc(m.subject) + '</div>' : '') +
        '<div class="adm-msg-body">' + esc(m.message) + '</div></div>';
    }).join('');
  }

  // ---- products ----
  async function loadProducts() {
    const host = document.getElementById('productsHost');
    const { data, error } = await CLIMAS.sb.from('products').select('*').order('sort');
    if (error) { host.innerHTML = '<div class="empty-state"><h4>Could not load products</h4><p>' + esc(error.message) + '</p></div>'; return; }
    host.innerHTML = data.map(p => {
      const cedis = (p.price_pesewas / 100);
      const per = p.period ? (' / ' + p.period) : ' one-time';
      return '<div class="adm-prod">' +
        '<div><div class="pname">' + esc(p.name) + '<span style="color:var(--ink-mute);font-weight:400">' + per + '</span></div><div class="pslug">' + esc(p.slug) + '</div></div>' +
        '<div class="price-edit">GH\u20B5 <input type="number" step="1" min="0" value="' + cedis + '" data-price="' + p.slug + '"></div>' +
        '<div style="display:flex;gap:8px;align-items:center"><label style="font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center"><input type="checkbox" data-active="' + p.slug + '"' + (p.active ? ' checked' : '') + '> Active</label>' +
        '<button class="btn btn-solid" data-save="' + p.slug + '">Save</button></div>' +
        '</div>';
    }).join('');

    host.querySelectorAll('button[data-save]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const slug = btn.dataset.save;
        const priceEl = host.querySelector('input[data-price="' + slug + '"]');
        const activeEl = host.querySelector('input[data-active="' + slug + '"]');
        const pesewas = Math.round(parseFloat(priceEl.value || '0') * 100);
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
        const { error } = await CLIMAS.sb.from('products').update({ price_pesewas: pesewas, active: activeEl.checked }).eq('slug', slug);
        if (error) CLIMAS.toast('Could not save: ' + error.message, 'err');
        else CLIMAS.toast('Saved', 'ok');
        btn.disabled = false; btn.textContent = 'Save';
      });
    });
  }

  // ---- stats ----
  async function loadStats() {
    const host = document.getElementById('statGrid');
    try {
      const { data: orders } = await CLIMAS.sb.from('orders').select('status, subtotal_pesewas, admin_hidden');
      const { count: users } = await CLIMAS.sb.from('profiles').select('*', { count: 'exact', head: true });
      const { count: msgs } = await CLIMAS.sb.from('contact_messages').select('*', { count: 'exact', head: true });
      const all = (orders || []).filter(o => !o.admin_hidden);
      const pending = all.filter(o => o.status === 'pending_payment').length;
      const revenue = all.filter(o => ['paid','shipped','delivered'].includes(o.status)).reduce((s, o) => s + (o.subtotal_pesewas || 0), 0);
      host.innerHTML =
        stat(all.length, 'Total orders') +
        stat(pending, 'Awaiting payment', true) +
        stat(CLIMAS.money(revenue), 'Revenue (confirmed)') +
        stat((users || 0) + ' · ' + (msgs || 0), 'Customers · Messages');
    } catch (e) { host.innerHTML = ''; }
  }
  function stat(num, lab, accent) {
    return '<div class="stat' + (accent ? ' accent' : '') + '"><div class="num">' + num + '</div><div class="lab">' + lab + '</div></div>';
  }

  // ---- CSV export ----
  function toCSV(rows) {
    return rows.map(r => r.map(cell => {
      const s = (cell == null ? '' : String(cell));
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\r\n');
  }
  function downloadCSV(filename, rows) {
    const blob = new Blob(['\uFEFF' + toCSV(rows)], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function exportOrders() {
    if (!ALL_ORDERS.length) { CLIMAS.toast('No orders to export', 'err'); return; }
    const rows = [['Order','Date','Status','Customer','Phone','City','Address','Items','Total (GHS)']];
    ALL_ORDERS.forEach(o => {
      const items = (o.order_items || []).map(i => i.name_snapshot + (i.qty > 1 ? ' x' + i.qty : '')).join('; ') || 'CLIMAS device';
      rows.push(['CLM-' + o.id.slice(0,6).toUpperCase(), new Date(o.created_at).toLocaleString('en-GB'),
        STATUS_LABEL[o.status] || o.status, o.shipping_name, o.shipping_phone, o.shipping_city, o.shipping_address, items, (o.subtotal_pesewas/100).toFixed(2)]);
    });
    downloadCSV('climas-orders-' + new Date().toISOString().slice(0,10) + '.csv', rows);
  }
  function exportMessages() {
    if (!ALL_MESSAGES.length) { CLIMAS.toast('No messages to export', 'err'); return; }
    const rows = [['Date','Name','Email','Subject','Message']];
    ALL_MESSAGES.forEach(m => rows.push([new Date(m.created_at).toLocaleString('en-GB'), m.name, m.email, m.subject, m.message]));
    downloadCSV('climas-messages-' + new Date().toISOString().slice(0,10) + '.csv', rows);
  }

  // ---- init ----
  (async function () {
    if (!CLIMAS.configured) { gate('loginView'); const e = document.getElementById('loginErr'); e.textContent = 'Backend not configured.'; e.classList.remove('hide'); return; }
    const user = await CLIMAS.getUser();
    if (!user) { gate('loginView'); return; }
    const { data: adminRow } = await CLIMAS.sb.from('admins').select('user_id').eq('user_id', user.id).maybeSingle();
    if (!adminRow) { gate('denyView'); return; }

    gate('dashView');
    document.getElementById('orderFilter').addEventListener('change', renderOrders);
    document.getElementById('refreshOrders').addEventListener('click', loadOrders);
    document.getElementById('exportOrders').addEventListener('click', exportOrders);
    document.getElementById('refreshMessages').addEventListener('click', loadMessages);
    document.getElementById('exportMessages').addEventListener('click', exportMessages);

    loadStats();
    loadOrders();
